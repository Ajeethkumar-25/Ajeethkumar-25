<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b1e"/>
      <stop offset="50%" stop-color="#160e33"/>
      <stop offset="100%" stop-color="#05050f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="500" height="500" rx="250" fill="url(#bgGradient)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.15" stroke="#06b6d4" stroke-width="1">
    <line x1="50" y1="150" x2="450" y2="150"/>
    <line x1="50" y1="250" x2="450" y2="250"/>
    <line x1="50" y1="350" x2="450" y2="350"/>
    <line x1="150" y1="50" x2="150" y2="450"/>
    <line x1="250" y1="50" x2="250" y2="450"/>
    <line x1="350" y1="50" x2="350" y2="450"/>
  </g>

  <!-- Glowing Neural Orbit Ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="15 10" opacity="0.8"/>
  <circle cx="250" cy="250" r="190" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>

  <!-- Orbit Nodes -->
  <circle cx="250" cy="40" r="8" fill="#06b6d4" filter="url(#neonGlow)"/>
  <circle cx="460" cy="250" r="8" fill="#8b5cf6" filter="url(#neonGlow)"/>
  <circle cx="250" cy="460" r="8" fill="#ec4899" filter="url(#neonGlow)"/>
  <circle cx="40" cy="250" r="8" fill="#06b6d4" filter="url(#neonGlow)"/>

  <!-- Neural Network Connections -->
  <g stroke="#8b5cf6" stroke-width="2" opacity="0.5">
    <line x1="250" y1="150" x2="170" y2="230"/>
    <line x1="250" y1="150" x2="330" y2="230"/>
    <line x1="170" y1="230" x2="250" y2="310"/>
    <line x1="330" y1="230" x2="250" y2="310"/>
    <line x1="170" y1="230" x2="330" y2="230"/>
  </g>

  <!-- Central Hex Shield -->
  <polygon points="250,110 370,180 370,320 250,390 130,320 130,180" 
           fill="#120f2e" stroke="url(#glowGrad)" stroke-width="5" filter="url(#neonGlow)"/>

  <!-- AI Core Monogram / Symbol -->
  <!-- Letter A Styled Geometric AI Core -->
  <polygon points="250,150 320,330 280,330 265,290 235,290 220,330 180,330" 
           fill="url(#accentGrad)"/>
  <polygon points="250,205 260,255 240,255" fill="#120f2e"/>

  <!-- Neural Nodes in Center -->
  <circle cx="250" cy="150" r="6" fill="#06b6d4" filter="url(#neonGlow)"/>
  <circle cx="180" cy="330" r="6" fill="#8b5cf6" filter="url(#neonGlow)"/>
  <circle cx="320" cy="330" r="6" fill="#ec4899" filter="url(#neonGlow)"/>

  <!-- AI ENGINEER Subtext Banner -->
  <rect x="160" y="355" width="180" height="30" rx="15" fill="#1f144d" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="250" y="375" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="3">AI ENGINEER</text>
</svg>